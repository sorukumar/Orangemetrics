<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions -->
    <defs>
        <linearGradient id="vaultGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2D3047"/>
            <stop offset="100%" stop-color="#454968"/>
        </linearGradient>
        <linearGradient id="orangeGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FF8B5E"/>
            <stop offset="100%" stop-color="#FFD3C4"/>
        </linearGradient>
        <filter id="softGlow">
            <feGaussianBlur stdDeviation="1.5" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background Pattern -->
    <pattern id="securityGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
        <rect width="30" height="30" fill="none" stroke="#FFD3C4" stroke-width="0.5"/>
        <circle cx="15" cy="15" r="1" fill="#FFD3C4"/>
    </pattern>
    <rect width="400" height="300" fill="url(#securityGrid)" opacity="0.1"/>

    <!-- Secure Vault (Central) -->
    <g transform="translate(200, 150)">
        <!-- Vault Base -->
        <path d="M-60 -50 L60 -50 L60 50 L-60 50 Z" 
              fill="url(#vaultGradient)" 
              filter="url(#softGlow)"/>
        
        <!-- Vault Door -->
        <rect x="-40" y="-30" width="80" height="60" rx="5" 
              fill="#97B3D0" opacity="0.3"/>
        
        <!-- Lock -->
        <circle cx="25" cy="0" r="8" fill="#FF8B5E"/>
        <rect x="21" y="-4" width="8" height="8" rx="2" fill="#2D3047"/>
    </g>

    <!-- Customer Data Sources (Left) -->
    <g transform="translate(50, 100)">
        <!-- Data Sources Container -->
        <rect x="-30" y="-30" width="60" height="60" rx="8" 
              fill="#FFFFFF" stroke="#97B3D0" stroke-width="2"/>
        
        <!-- Database Icon -->
        <g transform="translate(-15, -15)">
            <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#97B3D0"/>
            <rect x="-6" y="-4" width="12" height="2" fill="#FFFFFF"/>
        </g>
        
        <!-- API/Cloud Icon -->
        <g transform="translate(15, -15)">
            <path d="M-8 0 C-8 -4, -4 -8, 0 -8 C4 -8, 8 -4, 8 0 C8 4, 4 8, 0 8 C-4 8, -8 4, -8 0" 
                  fill="#97B3D0"/>
        </g>
        
        <!-- File Icon -->
        <g transform="translate(0, 15)">
            <path d="M-8 -8 L0 -8 L4 -4 L4 8 L-8 8 Z" fill="#97B3D0"/>
            <line x1="0" y1="-8" x2="0" y2="-4" stroke="#FFFFFF" stroke-width="1"/>
            <line x1="0" y1="-4" x2="4" y2="-4" stroke="#FFFFFF" stroke-width="1"/>
        </g>
        
        <!-- Flow Line -->
        <path d="M35 0 C80 0, 100 50, 120 50" 
              stroke="#97B3D0" 
              stroke-width="2"
              stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" 
                     from="8" to="0" dur="2s" 
                     repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Orange Enrichment Data (Top) -->
    <g transform="translate(200, 40)">
        <!-- Orange Data Icon -->
        <circle r="25" fill="url(#orangeGradient)"/>
        <text x="0" y="5" 
              font-family="monospace" 
              font-size="12" 
              fill="#FFFFFF"
              text-anchor="middle">⚡</text>
        
        <!-- Flow Line -->
        <path d="M0 30 L0 60" 
              stroke="#FF8B5E" 
              stroke-width="2"
              stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" 
                     from="8" to="0" dur="2s" 
                     repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Analysis Tools (Right) -->
    <g transform="translate(350, 150)">
        <!-- Analysis Icon -->
        <rect x="-25" y="-40" width="50" height="80" rx="8" 
              fill="#FFFFFF" stroke="#97B3D0" stroke-width="2"/>
        
        <!-- Chart Lines -->
        <line x1="-15" y1="20" x2="15" y2="0" 
              stroke="#FF8B5E" stroke-width="2"/>
        <line x1="-15" y1="-10" x2="15" y2="-20" 
              stroke="#FF8B5E" stroke-width="2"/>
        
        <!-- Connection Line -->
        <path d="M-30 0 L-80 0" 
              stroke="#97B3D0" 
              stroke-width="2"
              stroke-dasharray="4 4">
            <animate attributeName="stroke-dashoffset" 
                     from="8" to="0" dur="2s" 
                     repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Data Combination Indicator -->
    <g transform="translate(200, 150)">
        <!-- Combination Circle -->
        <circle r="15" fill="#FFFFFF" stroke="#FF8B5E" stroke-width="2"/>
        <path d="M-5 0 L5 0 M0 -5 L0 5" 
              stroke="#FF8B5E" stroke-width="2"/>
    </g>

    <!-- Labels -->
    <g font-family="sans-serif" font-size="10" fill="#2D3047">
        <text x="50" y="170" text-anchor="middle">Your Data Sources</text>
        <text x="200" y="90" text-anchor="middle">Orange Edge</text>
        <text x="350" y="85" text-anchor="middle">Analysis</text>
        <text x="200" y="220" text-anchor="middle">Secure Vault</text>
    </g>

    <!-- Security Indicators -->
    <g>
        <!-- Encryption Symbols -->
        <text x="140" y="270" 
              font-family="monospace" 
              font-size="10" 
              fill="#2D3047">AES-256</text>
        <text x="260" y="270" 
              font-family="monospace" 
              font-size="10" 
              fill="#2D3047">End-to-End</text>
    </g>
</svg>
