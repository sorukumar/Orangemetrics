<svg width="100%" height="100%" viewBox="0 0 1440 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <!-- Very subtle surgical grid -->
        <pattern id="premiumGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E4E4E7" stroke-width="0.5" opacity="0.6"/>
        </pattern>
        
        <!-- Soft glowing light leaks -->
        <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#FF7040" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#FF7040" stop-opacity="0" />
        </radialGradient>
        
        <radialGradient id="grayGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Base Grid -->
    <rect width="100%" height="100%" fill="url(#premiumGrid)"/>

    <!-- Ambient Glowing Orbs -->
    <circle cx="80%" cy="20%" r="400" fill="url(#orangeGlow)" />
    <circle cx="20%" cy="70%" r="500" fill="url(#grayGlow)" />
    <circle cx="60%" cy="80%" r="300" fill="url(#orangeGlow)" opacity="0.5" />

    <!-- Abstract Topography / Data Lines (Very thin and precise) -->
    <path d="M-100,600 C300,600 400,200 800,200 C1100,200 1300,400 1600,400" stroke="#FF7040" stroke-width="1" opacity="0.4" fill="none">
        <animate attributeName="stroke-dasharray" values="0, 2000; 2000, 0" dur="15s" repeatCount="indefinite"/>
    </path>
    
    <path d="M-100,650 C200,650 450,250 850,250 C1150,250 1250,450 1600,450" stroke="#A1A1AA" stroke-width="0.5" opacity="0.5" fill="none" />

    <!-- Precise data nodes -->
    <g opacity="0.8">
        <!-- Node 1 -->
        <circle cx="800" cy="200" r="3" fill="#FF7040" />
        <circle cx="800" cy="200" r="10" stroke="#FF7040" stroke-width="0.5" fill="none">
            <animate attributeName="r" values="3; 25; 3" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="1; 0; 1" dur="4s" repeatCount="indefinite" />
        </circle>

        <!-- Node 2 -->
        <circle cx="1300" cy="400" r="2" fill="#A1A1AA" />
        <circle cx="1300" cy="400" r="10" stroke="#A1A1AA" stroke-width="0.5" fill="none">
            <animate attributeName="r" values="2; 15; 2" dur="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.8; 0; 0.8" dur="3s" repeatCount="indefinite" />
        </circle>
        
        <!-- Node 3 -->
        <circle cx="400" cy="420" r="2" fill="#A1A1AA" />
    </g>
</svg>