<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Define gradients and filters -->
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="400" y2="300">
            <stop offset="0%" stop-color="#FFE4DC"/>
            <stop offset="100%" stop-color="#FFF6F3"/>
        </linearGradient>
        <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF8B5E" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FF8B5E" stop-opacity="0.05"/>
        </linearGradient>
        <filter id="dropShadow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Background with subtle pattern -->
    <rect width="400" height="300" fill="url(#bgGradient)"/>
    
    <!-- Main Dashboard Container -->
    <rect x="40" y="40" width="320" height="220" rx="12" fill="#FFFFFF" filter="url(#dropShadow)"/>
    
    <!-- Top Bar -->
    <rect x="40" y="40" width="320" height="40" rx="12" fill="#2D3047"/>
    
    <!-- Menu Icons -->
    <circle cx="65" cy="60" r="6" fill="#FF8B5E"/>
    <circle cx="85" cy="60" r="6" fill="#97B3D0"/>
    <circle cx="105" cy="60" r="6" fill="#FFD3C4"/>
    
    <!-- Main Chart Area -->
    <rect x="55" y="95" width="180" height="150" rx="8" fill="#F8F9FC"/>
    
    <!-- Chart Lines and Points -->
    <path d="M55 195 L85 160 L115 180 L145 140 L175 155 L205 120 L235 145" 
          stroke="#FF8B5E" 
          stroke-width="2.5"
          fill="none"/>
    
    <!-- Chart Area Fill -->
    <path d="M55 195 L85 160 L115 180 L145 140 L175 155 L205 120 L235 145 L235 195 L55 195" 
          fill="url(#chartGradient)"/>
    
    <!-- Data Points -->
    <circle cx="85" cy="160" r="4" fill="#FF8B5E"/>
    <circle cx="115" cy="180" r="4" fill="#FF8B5E"/>
    <circle cx="145" cy="140" r="4" fill="#FF8B5E"/>
    <circle cx="175" cy="155" r="4" fill="#FF8B5E"/>
    <circle cx="205" cy="120" r="4" fill="#FF8B5E"/>
    <circle cx="235" cy="145" r="4" fill="#FF8B5E"/>
    
    <!-- Side Panel -->
    <rect x="250" y="95" width="95" height="150" rx="8" fill="#F8F9FC"/>
    
    <!-- Panel Items -->
    <rect x="260" y="110" width="75" height="8" rx="4" fill="#FF8B5E" opacity="0.8"/>
    <rect x="260" y="130" width="75" height="8" rx="4" fill="#97B3D0" opacity="0.6"/>
    <rect x="260" y="150" width="75" height="8" rx="4" fill="#97B3D0" opacity="0.6"/>
    <rect x="260" y="170" width="75" height="8" rx="4" fill="#97B3D0" opacity="0.6"/>
    
    <!-- Interactive Elements -->
    <circle cx="290" cy="210" r="12" fill="#FF8B5E" opacity="0.2"/>
    <circle cx="320" cy="210" r="12" fill="#97B3D0" opacity="0.2"/>
</svg>
