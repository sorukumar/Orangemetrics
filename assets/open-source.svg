<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Define gradients and filters -->
    <defs>
        <linearGradient id="nodeBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE4DC"/>
            <stop offset="100%" stop-color="#FFD3C4"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="connectionGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FF8B5E"/>
            <stop offset="100%" stop-color="#97B3D0"/>
        </linearGradient>
    </defs>

    <!-- Background Pattern -->
    <pattern id="hexPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M20 5 L35 15 L35 25 L20 35 L5 25 L5 15 Z" 
              stroke="#FFD3C4" 
              fill="none" 
              stroke-width="0.5"/>
    </pattern>
    <rect width="400" height="300" fill="url(#hexPattern)" opacity="0.2"/>

    <!-- Central Repository -->
    <g transform="translate(200, 150)" filter="url(#glow)">
        <path d="M-40 -40 L40 -40 L60 0 L40 40 L-40 40 L-60 0 Z" 
              fill="#2D3047"/>
        <text x="0" y="5" 
              font-family="monospace" 
              font-size="14" 
              fill="#FFFFFF" 
              text-anchor="middle" 
              dominant-baseline="middle">OSS</text>
    </g>

    <!-- Connected Nodes -->
    <g class="node" transform="translate(80, 100)">
        <circle r="25" fill="url(#nodeBg)"/>
        <text x="0" y="0" 
              font-family="monospace" 
              font-size="12" 
              fill="#2D3047" 
              text-anchor="middle" 
              dominant-baseline="middle">&lt;/&gt;</text>
    </g>

    <g class="node" transform="translate(320, 100)">
        <circle r="25" fill="url(#nodeBg)"/>
        <text x="0" y="0" 
              font-family="monospace" 
              font-size="12" 
              fill="#2D3047" 
              text-anchor="middle" 
              dominant-baseline="middle">{}</text>
    </g>

    <g class="node" transform="translate(200, 250)">
        <circle r="25" fill="url(#nodeBg)"/>
        <text x="0" y="0" 
              font-family="monospace" 
              font-size="12" 
              fill="#2D3047" 
              text-anchor="middle" 
              dominant-baseline="middle">#</text>
    </g>

    <!-- Connection Lines with Gradient -->
    <g stroke="url(#connectionGradient)" stroke-width="2" stroke-dasharray="4 4">
        <path d="M80 100 Q140 125, 160 150" fill="none"/>
        <path d="M320 100 Q260 125, 240 150" fill="none"/>
        <path d="M200 190 L200 225" fill="none"/>
    </g>

    <!-- Connection Points -->
    <circle cx="80" cy="100" r="3" fill="#FF8B5E"/>
    <circle cx="320" cy="100" r="3" fill="#FF8B5E"/>
    <circle cx="200" cy="250" r="3" fill="#FF8B5E"/>

    <!-- Pulse Effects -->
    <circle cx="80" cy="100" r="28" stroke="#FF8B5E" fill="none" opacity="0.2">
        <animate attributeName="r" from="28" to="32" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="100" r="28" stroke="#FF8B5E" fill="none" opacity="0.2">
        <animate attributeName="r" from="28" to="32" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="250" r="28" stroke="#FF8B5E" fill="none" opacity="0.2">
        <animate attributeName="r" from="28" to="32" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>
